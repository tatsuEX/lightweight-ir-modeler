# アプリケーション静的設定（Spring の application.yml 相当）
# ベース設定。環境個別値は APP_PROFILE による application-{profile}.yml で上書きする

app:
  name: lightweight-ir-modeler
  io:
    # importDir: ./data/import
    exportDir: ./data/export
    export:
      templates:
        # Handlebars 等のテンプレート根（target ごと）。plugin 的に差し替え可能
        primefaces:
          dir: ./templates/export/primefaces

# Property 属性エディタ（layout-editor/property）
# =================================================================================================
layoutEditor:
  property:
    # items タグ表記: `${value}${itemDelimiter}${label}`（同一なら区切りなしの単一文字列）
    itemDelimiter: ":"
    # 未使用の画面 ID（新規 snapshot ディレクトリ）確定時に確認ダイアログを出す
    confirmSnapshotDirCreation: true

# プレビュー画面: テーマ選択と外部 UI 定義の出力先
# =================================================================================================
preview:

  # プレビュー画面：UIテーマ
  theme:
    default: tailwind-light
    options:
      - name: Tailwind Dark
        value: tailwind-dark
      - name: Tailwind Light
        value: tailwind-light
      - name: Bootstrap Dark
        value: bootstrap-dark
      - name: Bootstrap Light
        value: bootstrap-light

  # 変換先（target）
  transformTarget:
    default: primefaces
    options:
      - name: PrimeFaces
        value: primefaces
      - name: IM-Forma
        value: im-forma

# サーバ側ロギング（Winston）。クライアントには出さない
# =================================================================================================
logging:
  level: info
  console:
    enabled: true
  file:
    dir: ./logs
    info:
      enabled: true
      filename: info.log
      rolling: daily
      maxFiles: 14d
    error:
      enabled: true
      filename: error.log
      rolling: monthly
      maxFiles: "12"

