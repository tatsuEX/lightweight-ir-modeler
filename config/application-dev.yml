# 開発環境 overlay（Spring の application-dev.yml 相当）
# APP_PROFILE=dev のとき application.yml へ merge される

app:
  name: lightweight-ir-modeler
  io:
    # importDir: ./data/import
    exportDir: ./data/export

# IR に関する設定
# =================================================================================================
ir:

  # IR snapshot ファイルの自動保存
  autoSave:
    enabled: true
    delay: 500
    # コメント map のみ変化したときに delay へ加算する（ms）。0 なら IR と同じ
    commentDelayExtra: 1500
    dir: ./data/ir
    maxGenerations: 10

# 開発時は debug。ファイル rolling はベース設定を継承
# =================================================================================================
logging:
  level: debug

